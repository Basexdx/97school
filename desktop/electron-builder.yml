appId: school.genius.physics
productName: Genius
copyright: Copyright © 2026 Genius

directories:
  output: release/windows

files:
  - desktop/main.cjs
  - out/**/*

extraMetadata:
  main: desktop/main.cjs
  version: 1.2.0

asar: true
compression: maximum

win:
  icon: public/icons/icon-512.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Genius-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Genius

portable:
  artifactName: Genius-Portable-${version}-${arch}.${ext}
