name: Fix grade 7 controlled inputs

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Patch grade 7 task inputs
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/grade7-task-bank.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              "if(current)return <Grade7TaskCard task={current}",
              "if(current)return <Grade7TaskCard key={current.ID} task={current}"
            ),
            (
              "function emptyAnswer(spec){if(spec.mode==='numeric_list')return spec.values.map(()=> '');if(spec.mode==='parts')return spec.parts.map(()=> '');if(spec.mode==='set')return [];return ''}",
              "function emptyAnswer(spec){if(spec.mode==='numeric_list')return (spec.fields||spec.values||[]).map(()=> '');if(spec.mode==='parts')return (spec.parts||[]).map(()=> '');if(spec.mode==='set')return [];return ''}"
            ),
            (
              "value={value[i]}",
              "value={value?.[i]??''}"
            )
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected source fragment not found: {old[:80]}')
            s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/grade7-task-bank.js
          git commit -m "fix: keep grade 7 answer inputs controlled"
          git push origin HEAD:dev
