name: Build 97school Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Windows platform files
        working-directory: mobile
        run: flutter create . --platforms=windows

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build Windows release
        working-directory: mobile
        run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: Compress-Archive -Path mobile/build/windows/x64/runner/Release/* -DestinationPath 97school-windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: 97school-windows
          path: 97school-windows.zip
          retention-days: 30
