name: Build Genius dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test task banks
        run: npm run test:bank
      - name: Test SQLite server adapter
        run: npm run test:server
      - name: Validate preview gate syntax
        run: node --check server/preview-gate.mjs
      - name: Validate Caddy configuration
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build Genius API server bundle
        run: npm run build:api
      - name: Build Genius
        run: npm run build
      - name: Verify generated task banks
        run: |
          test -f public/task-bank/grade7.json
          test -f public/task-bank/index-grade7.json
          test -f public/task-bank/grade9.json
          test -f public/task-bank/index-grade9.json
          node - <<'NODE'
          const fs=require('fs')
          const b7=JSON.parse(fs.readFileSync('public/task-bank/grade7.json'))
          if(b7.tasks.length!==142) process.exit(1)
          const t161=b7.tasks.find(x=>x.BOOK_TASK_NUMBER===161)
          if(!t161||t161.DIAGRAM?.type!=='multi-line-chart'||/рис/i.test(t161.TASK)) process.exit(1)
          const b9=JSON.parse(fs.readFileSync('public/task-bank/grade9.json'))
          if(b9.tasks.length!==59) process.exit(1)
          const first=b9.tasks.filter(x=>x.BOOK_TASK_NUMBER>=1404&&x.BOOK_TASK_NUMBER<=1513)
          if(first.length!==35||first.some(x=>x.GRAPH_REQUIRED||!['numeric','numeric_list'].includes(x.ANSWER.mode))) process.exit(1)
          const second=b9.tasks.filter(x=>x.BOOK_TASK_NUMBER>=1588&&x.BOOK_TASK_NUMBER<=1611)
          if(second.length!==24) process.exit(1)
          const i8=JSON.parse(fs.readFileSync('public/task-bank/index.json'))
          if(i8.tasks.length!==321) process.exit(1)
          console.log('Banks OK: grade7=142, grade8=321, grade9=59')
          NODE
